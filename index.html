<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ứng Dụng Trắc Nghiệm Ôn Tập</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800">

    <!-- Container chính -->
    <div class="max-w-3xl mx-auto px-4 py-8">
        
        <!-- Tiêu đề ứng dụng -->
        <header class="text-center mb-8">
            <h1 class="text-3xl font-bold text-indigo-600 mb-2">Trắc Nghiệm Mạng Máy Tính Nâng Cao</h1>
            <p class="text-slate-500">Ôn tập kiến thức, tương tác trực tiếp và quản lý câu hỏi dễ dàng</p>
        </header>

        <!-- Thanh điều hướng Tab -->
        <div class="flex justify-center mb-6 space-x-2">
            <button onclick="switchTab('quiz')" id="tab-quiz" class="px-6 py-2.5 rounded-lg font-medium transition-all bg-indigo-600 text-white shadow-md">
                Làm Trắc Nghiệm
            </button>
            <button onclick="switchTab('manage')" id="tab-manage" class="px-6 py-2.5 rounded-lg font-medium transition-all bg-white text-slate-600 hover:bg-slate-50 shadow-sm border border-slate-200">
                Quản Lý Câu Hỏi
            </button>
        </div>

        <!-- MÀN HÌNH 1: LÀM QUIZ -->
        <div id="section-quiz" class="bg-white rounded-2xl shadow-xl p-6 md:p-8 border border-slate-100">
            <!-- Thông tin tiến độ -->
            <div class="flex justify-between items-center mb-6 pb-4 border-b border-slate-100 text-sm">
                <span id="question-progress" class="font-semibold text-indigo-600">Câu 1 / 5</span>
                <span id="score-display" class="bg-indigo-50 text-indigo-700 px-3 py-1 rounded-full font-medium">Điểm: 0</span>
            </div>

            <!-- Nội dung câu hỏi -->
            <div class="mb-6">
                <h2 id="question-title" class="text-xl font-bold text-slate-800 mb-4 leading-relaxed">Đang tải câu hỏi...</h2>
                <!-- Danh sách đáp án -->
                <div id="options-container" class="space-y-3">
                    <!-- Được render bằng JavaScript -->
                </div>
            </div>

            <!-- Khu vực giải thích đáp án -->
            <div id="explanation-box" class="hidden mb-6 p-4 rounded-xl text-sm border"></div>

            <!-- Nút chuyển câu / Hoàn thành -->
            <div class="flex justify-end">
                <button id="next-btn" onclick="nextQuestion()" class="hidden bg-indigo-600 hover:bg-indigo-700 text-white font-medium px-6 py-2.5 rounded-xl transition-all shadow-md">
                    Câu tiếp theo ➡️
                </button>
            </div>
        </div>

        <!-- MÀN HÌNH 2: QUẢN LÝ CÂU HỎI (THÊM / SỬA / XÓA) -->
        <div id="section-manage" class="hidden space-y-6">
            <!-- Form Thêm / Sửa câu hỏi -->
            <div class="bg-white rounded-2xl shadow-xl p-6 md:p-8 border border-slate-100">
                <h2 id="form-title" class="text-xl font-bold text-slate-800 mb-4">➕ Thêm Câu Hỏi Mới</h2>
                <form id="question-form" onsubmit="handleFormSubmit(event)" class="space-y-4">
                    <input type="hidden" id="edit-index" value="-1">
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">Nội dung câu hỏi:</label>
                        <textarea id="input-question" required rows="3" class="w-full px-4 py-2 border border-slate-300 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:outline-none" placeholder="Nhập câu hỏi..."></textarea>
                    </div>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-sm font-medium text-slate-700 mb-1">Đáp án A:</label>
                            <input type="text" id="input-opt-0" required class="w-full px-4 py-2 border border-slate-300 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:outline-none" placeholder="Đáp án A">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-slate-700 mb-1">Đáp án B:</label>
                            <input type="text" id="input-opt-1" required class="w-full px-4 py-2 border border-slate-300 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:outline-none" placeholder="Đáp án B">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-slate-700 mb-1">Đáp án C:</label>
                            <input type="text" id="input-opt-2" required class="w-full px-4 py-2 border border-slate-300 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:outline-none" placeholder="Đáp án C">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-slate-700 mb-1">Đáp án D:</label>
                            <input type="text" id="input-opt-3" required class="w-full px-4 py-2 border border-slate-300 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:outline-none" placeholder="Đáp án D">
                        </div>
                    </div>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-sm font-medium text-slate-700 mb-1">Đáp án đúng:</label>
                            <select id="input-correct" class="w-full px-4 py-2 border border-slate-300 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                                <option value="0">Đáp án A</option>
                                <option value="1">Đáp án B</option>
                                <option value="2">Đáp án C</option>
                                <option value="3">Đáp án D</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-slate-700 mb-1">Giải thích chi tiết:</label>
                            <input type="text" id="input-explanation" required class="w-full px-4 py-2 border border-slate-300 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:outline-none" placeholder="Nhập lý do đúng...">
                        </div>
                    </div>
                    <div class="flex space-x-3 pt-2">
                        <button type="submit" id="submit-btn" class="bg-indigo-600 hover:bg-indigo-700 text-white font-medium px-6 py-2.5 rounded-xl transition-all shadow-md">
                            Lưu Câu Hỏi
                        </button>
                        <button type="button" id="cancel-edit-btn" onclick="resetForm()" class="hidden bg-slate-200 hover:bg-slate-300 text-slate-700 font-medium px-6 py-2.5 rounded-xl transition-all">
                            Hủy
                        </button>
                    </div>
                </form>
            </div>

            <!-- Danh sách câu hỏi đang có -->
            <div class="bg-white rounded-2xl shadow-xl p-6 md:p-8 border border-slate-100">
                <div class="flex justify-between items-center mb-4">
                    <h2 class="text-xl font-bold text-slate-800">📋 Danh Sách Câu Hỏi Hiện Có</h2>
                    <button onclick="resetToDefaultQuestions()" class="text-sm text-red-600 hover:underline">Khôi phục mặc định</button>
                </div>
                <div id="questions-list" class="space-y-4">
                    <!-- Render danh sách quản lý -->
                </div>
            </div>
        </div>
    </div>

    <!-- JavaScript xử lý logic -->
    <script>
        // Dữ liệu mặc định
        const defaultQuestions = [
            {
                question: "Mạng không dây là hệ thống các thiết bị có khả năng giao tiếp thông qua gì?",
                options: [
                    "Cáp quang đa mốt",
                    "Sóng điện từ",
                    "Đường truyền cáp đồng trục",
                    "Tín hiệu dòng điện trực tiếp"
                ],
                correct: 1,
                explanation: "Mạng không dây truyền tải dữ liệu thông qua sóng điện từ (như sóng radio, hồng ngoại, vi ba) mà không cần cáp vật lý."
            },
            {
                question: "Câu hỏi trọng tâm đặt ra trong slide khái niệm mạng không dây nhằm khám phá khía cạnh nào?",
                options: [
                    "Chi phí lắp đặt và bảo trì phần cứng.",
                    "Lý do tồn tại (tại sao phải có) và lợi ích của mạng không dây.",
                    "Tốc độ truyền tải tối đa của sóng điện từ.",
                    "Các chuẩn bảo mật an toàn thông tin mạng."
                ],
                correct: 1,
                explanation: "Slide đặt ra câu hỏi 'Tại sao phải có mạng không dây? Lợi ích của mạng không dây là gì?' để tìm hiểu lý do tồn tại và lợi ích thực tiễn."
            }
        ];

        // Lấy câu hỏi từ LocalStorage hoặc dùng mặc định
        let questions = JSON.parse(localStorage.getItem('mmtnc_questions')) || defaultQuestions;
        let currentIdx = 0;
        let score = 0;
        let answeredCurrent = false;

        // Chuyển đổi tab
        function switchTab(tab) {
            const quizSec = document.getElementById('section-quiz');
            const manageSec = document.getElementById('section-manage');
            const tabQuiz = document.getElementById('tab-quiz');
            const tabManage = document.getElementById('tab-manage');

            if (tab === 'quiz') {
                quizSec.classList.remove('hidden');
                manageSec.classList.add('hidden');
                tabQuiz.className = "px-6 py-2.5 rounded-lg font-medium transition-all bg-indigo-600 text-white shadow-md";
                tabManage.className = "px-6 py-2.5 rounded-lg font-medium transition-all bg-white text-slate-600 hover:bg-slate-50 shadow-sm border border-slate-200";
                loadQuiz();
            } else {
                quizSec.classList.add('hidden');
                manageSec.classList.remove('hidden');
                tabManage.className = "px-6 py-2.5 rounded-lg font-medium transition-all bg-indigo-600 text-white shadow-md";
                tabQuiz.className = "px-6 py-2.5 rounded-lg font-medium transition-all bg-white text-slate-600 hover:bg-slate-50 shadow-sm border border-slate-200";
                renderManageList();
            }
        }

        // Tải câu hỏi cho màn hình Quiz
        function loadQuiz() {
            answeredCurrent = false;
            document.getElementById('next-btn').classList.add('hidden');
            document.getElementById('explanation-box').classList.add('hidden');

            if (questions.length === 0) {
                document.getElementById('question-progress').innerText = "Trống";
                document.getElementById('question-title').innerText = "Hiện chưa có câu hỏi nào. Vui lòng sang tab 'Quản Lý Câu Hỏi' để thêm mới!";
                document.getElementById('options-container').innerHTML = "";
                return;
            }

            if (currentIdx >= questions.length) {
                currentIdx = 0;
            }

            const q = questions[currentIdx];
            document.getElementById('question-progress').innerText = `Câu ${currentIdx + 1} / ${questions.length}`;
            document.getElementById('score-display').innerText = `Điểm: ${score}`;
            document.getElementById('question-title').innerText = q.question;

            let html = "";
            q.options.forEach((opt, idx) => {
                html += `<button onclick="selectAnswer(${idx})" id="opt-${idx}" class="w-full text-left p-4 rounded-xl border border-slate-200 hover:bg-indigo-50 hover:border-indigo-300 transition-all font-medium text-slate-700">${String.fromCharCode(65 + idx)}. ${opt}</button>`;
            });
            document.getElementById('options-container').innerHTML = html;
        }

        // Xử lý chọn đáp án
        function selectAnswer(selectedIdx) {
            if (answeredCurrent) return;
            answeredCurrent = true;

            const q = questions[currentIdx];
            const correctIdx = q.correct;
            const explanationBox = document.getElementById('explanation-box');

            for (let i = 0; i < 4; i++) {
                const btn = document.getElementById(`opt-${i}`);
                if (!btn) continue;
                btn.disabled = true;
                if (i === correctIdx) {
                    btn.className = "w-full text-left p-4 rounded-xl border border-emerald-500 bg-emerald-50 text-emerald-800 font-medium";
                } else if (i === selectedIdx) {
                    btn.className = "w-full text-left p-4 rounded-xl border border-rose-500 bg-rose-50 text-rose-800 font-medium";
                } else {
                    btn.className = "w-full text-left p-4 rounded-xl border border-slate-200 opacity-50 text-slate-500";
                }
            }

            if (selectedIdx === correctIdx) {
                score++;
                explanationBox.className = "mb-6 p-4 rounded-xl text-sm border border-emerald-200 bg-emerald-50 text-emerald-800";
                explanationBox.innerHTML = `<strong>Chính xác! 🎉</strong><br>${q.explanation}`;
            } else {
                explanationBox.className = "mb-6 p-4 rounded-xl text-sm border border-rose-200 bg-rose-50 text-rose-800";
                explanationBox.innerHTML = `<strong>Chưa chính xác! ❌</strong><br>${q.explanation}`;
            }
            explanationBox.classList.remove('hidden');
            document.getElementById('score-display').innerText = `Điểm: ${score}`;
            document.getElementById('next-btn').classList.remove('hidden');
        }

        // Chuyển câu tiếp theo
        function nextQuestion() {
            currentIdx++;
            if (currentIdx >= questions.length) {
                currentIdx = 0;
            }
            loadQuiz();
        }

        // Render danh sách quản lý câu hỏi
        function renderManageList() {
            const listContainer = document.getElementById('questions-list');
            if (questions.length === 0) {
                listContainer.innerHTML = "<p class='text-slate-500 text-center py-4'>Chưa có câu hỏi nào trong hệ thống.</p>";
                return;
            }

            let html = "";
            questions.forEach((q, idx) => {
                html += `
                    <div class="p-4 rounded-xl border border-slate-200 bg-slate-50 space-y-2">
                        <div class="flex justify-between items-start">
                            <span class="font-bold text-indigo-600 text-sm">Câu ${idx + 1}</span>
                            <div class="space-x-2">
                                <button onclick="editQuestion(${idx})" class="text-xs bg-amber-500 hover:bg-amber-600 text-white px-3 py-1 rounded-lg">Sửa</button>
                                <button onclick="deleteQuestion(${idx})" class="text-xs bg-rose-500 hover:bg-rose-600 text-white px-3 py-1 rounded-lg">Xóa</button>
                            </div>
                        </div>
                        <p class="font-medium text-slate-800">${q.question}</p>
                        <ul class="text-sm text-slate-600 grid grid-cols-1 md:grid-cols-2 gap-1 pl-4 list-disc">
                            ${q.options.map((o, oIdx) => `<li class="${oIdx === q.correct ? 'text-emerald-700 font-semibold' : ''}">${o}</li>`).join('')}
                        </ul>
                    </div>
                `;
            });
            listContainer.innerHTML = html;
        }

        // Thêm hoặc Cập nhật câu hỏi từ form
        function handleFormSubmit(e) {
            e.preventDefault();
            const editIdx = parseInt(document.getElementById('edit-index').value);
            const questionText = document.getElementById('input-question').value;
            const options = [
                document.getElementById('input-opt-0').value,
                document.getElementById('input-opt-1').value,
                document.getElementById('input-opt-2').value,
                document.getElementById('input-opt-3').value
            ];
            const correct = parseInt(document.getElementById('input-correct').value);
            const explanation = document.getElementById('input-explanation').value;

            const newQ = { question: questionText, options, correct, explanation };

            if (editIdx === -1) {
                questions.push(newQ);
            } else {
                questions[editIdx] = newQ;
            }

            localStorage.setItem('mmtnc_questions', JSON.stringify(questions));
            resetForm();
            renderManageList();
            alert("Đã lưu câu hỏi thành công!");
        }

        // Sửa câu hỏi
        function editQuestion(idx) {
            const q = questions[idx];
            document.getElementById('edit-index').value = idx;
            document.getElementById('input-question').value = q.question;
            for (let i = 0; i < 4; i++) {
                document.getElementById(`input-opt-${i}`).value = q.options[i];
            }
            document.getElementById('input-correct').value = q.correct;
            document.getElementById('input-explanation').value = q.explanation;

            document.getElementById('form-title').innerText = `✏️ Chỉnh Sửa Câu Hỏi #${idx + 1}`;
            document.getElementById('submit-btn').innerText = "Cập Nhật";
            document.getElementById('cancel-edit-btn').classList.remove('hidden');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // Xóa câu hỏi
        function deleteQuestion(idx) {
            if (confirm("Bạn có chắc chắn muốn xóa câu hỏi này không?")) {
                questions.splice(idx, 1);
                localStorage.setItem('mmtnc_questions', JSON.stringify(questions));
                renderManageList();
            }
        }

        // Reset form
        function resetForm() {
            document.getElementById('question-form').reset();
            document.getElementById('edit-index').value = "-1";
            document.getElementById('form-title').innerText = "➕ Thêm Câu Hỏi Mới";
            document.getElementById('submit-btn').innerText = "Lưu Câu Hỏi";
            document.getElementById('cancel-edit-btn').classList.add('hidden');
        }

        // Khôi phục mặc định
        function resetToDefaultQuestions() {
            if (confirm("Khôi phục lại các câu hỏi mặc định ban đầu?")) {
                questions = [...defaultQuestions];
                localStorage.setItem('mmtnc_questions', JSON.stringify(questions));
                renderManageList();
                loadQuiz();
            }
        }

        // Khởi chạy ban đầu
        loadQuiz();
    </script>
</body>
</html>
